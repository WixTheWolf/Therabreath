<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block;width:1920px;height:1080px}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import { createLight } from './light.js';
const q = new URLSearchParams(location.search);
const scene = q.get('scene') || 'drop', theme = q.get('theme') || 'a', scale = +(q.get('scale') || 1);
const c = document.getElementById('c'); c.width = 1920 * scale; c.height = 1080 * scale;
const cfg = scene === 'drop'
  ? { scene, theme, camera: { pos: [0, 0.55, 8.6], target: [0, -0.45, 0], fov: 26, shift: [0.30, 0.02] } }
  : { scene, theme, camera: { pos: [0, 1.35, 8.6], target: [0, 1.0, 0], fov: 24, shift: [0.26, -0.06] } };
try {
  const L = createLight(c, cfg);
  const t0 = performance.now();
  L.render(+(q.get('t') || 2.0), { rot: q.get('rot') ? +q.get('rot') : undefined });
  window.__done = { ms: Math.round(performance.now() - t0) };
} catch (e) { window.__done = { err: String(e) }; }
</script></body></html>
