<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The Flavor Factory × Church & Dwight / TheraBreath Capabilities Workshop booklet for July 2026."
    />
    <title>TheraBreath Capabilities Workshop Booklet</title>
    <style>
      :root {
        --therabreath-blue: #00a3e0;
        --mint: #7ed321;
        --navy: #091e38;
        --muted: #607080;
        --paper: #ffffff;
        --wash: #effbff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--navy);
        font-family: "Open Sans", Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at 12% 18%, rgba(126, 211, 33, 0.20), transparent 24rem),
          radial-gradient(circle at 88% 8%, rgba(0, 163, 224, 0.22), transparent 26rem),
          linear-gradient(135deg, #ffffff 0%, var(--wash) 100%);
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 2rem;
      }

      .card {
        width: min(100%, 58rem);
        overflow: hidden;
        border: 1px solid rgba(0, 163, 224, 0.18);
        border-radius: 2rem;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 1.5rem 4rem rgba(9, 30, 56, 0.14);
      }

      .hero {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
      }

      .copy {
        padding: clamp(2rem, 5vw, 4rem);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: var(--therabreath-blue);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Montserrat, Arial, Helvetica, sans-serif;
        font-size: clamp(2.25rem, 5vw, 4.5rem);
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 0.95;
      }

      .subtitle {
        max-width: 34rem;
        margin: 1.25rem 0 2rem;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }

      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        padding: 0.85rem 1.2rem;
        border-radius: 999px;
        font-weight: 800;
        text-decoration: none;
      }

      .primary {
        color: white;
        background: linear-gradient(135deg, var(--therabreath-blue), #007fb3);
      }

      .secondary {
        color: var(--navy);
        border: 1px solid rgba(0, 163, 224, 0.26);
        background: white;
      }

      .art {
        position: relative;
        min-height: 34rem;
        background:
          linear-gradient(160deg, rgba(0, 163, 224, 0.98), rgba(126, 211, 33, 0.90)),
          var(--therabreath-blue);
      }

      .sheet {
        position: absolute;
        inset: 4rem 3rem auto auto;
        width: min(62%, 17rem);
        aspect-ratio: 8.5 / 11;
        border-radius: 0.7rem;
        background: white;
        box-shadow: 0 1.4rem 3rem rgba(0, 0, 0, 0.24);
        transform: rotate(5deg);
      }

      .sheet::before {
        position: absolute;
        top: 2rem;
        left: 1.35rem;
        width: 68%;
        height: 0.75rem;
        border-radius: 99px;
        background: var(--therabreath-blue);
        box-shadow:
          0 2rem 0 rgba(126, 211, 33, 0.72),
          0 4rem 0 rgba(9, 30, 56, 0.12),
          0 6rem 0 rgba(9, 30, 56, 0.12),
          0 8rem 0 rgba(9, 30, 56, 0.12);
        content: "";
      }

      .molecule,
      .drop {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.62);
        border-radius: 999px;
      }

      .molecule.one {
        right: 3rem;
        bottom: 5rem;
        width: 8rem;
        height: 8rem;
      }

      .molecule.two {
        left: 2.5rem;
        top: 5rem;
        width: 5rem;
        height: 5rem;
      }

      .drop {
        left: 4rem;
        bottom: 5rem;
        width: 3rem;
        height: 4.25rem;
        border-radius: 55% 55% 60% 60%;
        transform: rotate(35deg);
      }

      footer {
        border-top: 1px solid rgba(0, 163, 224, 0.14);
        padding: 1rem 2rem;
        color: var(--muted);
        font-size: 0.82rem;
      }

      @media (max-width: 760px) {
        main {
          padding: 1rem;
        }

        .hero {
          grid-template-columns: 1fr;
        }

        .art {
          min-height: 18rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="page-title">
        <div class="hero">
          <div class="copy">
            <p class="eyebrow">The Flavor Factory × Church &amp; Dwight / TheraBreath</p>
            <h1 id="page-title">Breath of Innovation</h1>
            <p class="subtitle">
              Download the July 2026 Capabilities Workshop booklet, prepared exclusively for
              Church &amp; Dwight / TheraBreath.
            </p>
            <div class="actions" aria-label="Booklet actions">
              <a class="button primary" href="/dist/therabreath_capabilities_workshop_booklet.pdf">
                Open PDF booklet
              </a>
              <a class="button secondary" href="/dist/therabreath_capabilities_workshop_booklet.pdf" download>
                Download PDF
              </a>
            </div>
          </div>
          <div class="art" aria-hidden="true">
            <div class="sheet"></div>
            <div class="molecule one"></div>
            <div class="molecule two"></div>
            <div class="drop"></div>
          </div>
        </div>
        <footer>Confidential – Prepared exclusively for Church &amp; Dwight / TheraBreath | July 2026</footer>
      </section>
    </main>
  </body>
</html>
