name: Dash check
on: [push, pull_request]
jobs:
  dashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No em dashes or en dashes anywhere
        run: node playbook/design/scripts/check-dashes.mjs .
